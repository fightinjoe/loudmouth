<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Prototype 1: Web Speech API</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f0;
      --surface: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #666;
      --text-tertiary: #999;
      --accent: #2d6a4f;
      --accent-light: #e8f5ee;
      --border: #e0e0e0;
      --radius: 16px;
      --radius-sm: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .screen {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 1.25rem;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      gap: 0;
    }

    /* ── Review header ── */

    .review-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .review-counter {
      font-size: 0.875rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .flip-hint {
      font-size: 0.75rem;
      color: var(--text-tertiary);
    }

    /* ── Card flip ── */

    .card-scene {
      flex: 1;
      perspective: 1200px;
      margin-bottom: 1.25rem;
      min-height: 280px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      min-height: 280px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .card-inner.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      background: var(--surface);
      border-radius: var(--radius);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .card-back-face {
      transform: rotateY(180deg);
      overflow-y: auto;
    }

    /* Front face */

    .card-front-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0.5rem;
    }

    .card-text {
      font-size: 2.5rem;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: 0.02em;
    }

    .card-reading {
      font-size: 1rem;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }

    .card-type-badge {
      align-self: flex-start;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
    }

    .card-tap-hint {
      align-self: center;
      font-size: 0.75rem;
      color: var(--text-tertiary);
      margin-top: auto;
    }

    /* Play button — sits above tap hint */

    .btn-play {
      align-self: center;
      margin-top: auto;
      margin-bottom: 0.5rem;
      padding: 0.5rem 1.25rem;
      background: var(--accent-light);
      color: var(--accent);
      border: 1.5px solid var(--accent);
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }

    .btn-play:active { opacity: 0.7; }

    .btn-play.playing {
      opacity: 0.5;
      cursor: default;
    }

    /* Back face */

    .card-back-content {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: 100%;
    }

    .card-translation {
      font-size: 1.5rem;
      font-weight: 500;
      line-height: 1.3;
    }

    .card-notes {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.5;
      padding: 0.625rem 0.75rem;
      background: var(--bg);
      border-radius: var(--radius-sm);
    }

    .card-example {
      border-left: 3px solid var(--accent-light);
      padding-left: 0.875rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .card-example-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin-bottom: 0.25rem;
    }

    .card-example-text { font-size: 1rem; line-height: 1.4; }
    .card-example-reading { font-size: 0.8rem; color: var(--text-secondary); }
    .card-example-translation { font-size: 0.875rem; color: var(--text-secondary); font-style: italic; }

    /* Navigation */

    .nav-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.875rem 1rem;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }

    .btn:active { opacity: 0.75; }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-nav { padding: 0.75rem; font-size: 0.9rem; }

    .btn-nav:disabled { opacity: 0.35; cursor: default; }

    /* TTS support warning */
    .tts-warning {
      font-size: 0.8rem;
      color: #c0392b;
      background: #fdf2f2;
      border-radius: var(--radius-sm);
      padding: 0.625rem 0.75rem;
      margin-bottom: 1rem;
      display: none;
    }
    .tts-warning.visible { display: block; }
  </style>
</head>
<body>

  <div class="screen">
    <div class="review-header">
      <span class="review-counter" id="review-counter">1 / 0</span>
      <span class="flip-hint">tap card to flip</span>
    </div>

    <div id="tts-warning" class="tts-warning">
      Web Speech API not available on this browser.
    </div>

    <div class="card-scene" onclick="flipCard()">
      <div class="card-inner" id="card-inner">

        <div class="card-face card-front-face">
          <span class="card-type-badge" id="card-type"></span>
          <div class="card-front-text">
            <div class="card-text" id="card-front-text"></div>
            <div class="card-reading" id="card-front-reading"></div>
          </div>
          <button class="btn-play" id="btn-play" onclick="event.stopPropagation(); playAudio()">▶ Play</button>
          <span class="card-tap-hint">tap to reveal</span>
        </div>

        <div class="card-face card-back-face">
          <div class="card-back-content">
            <div class="card-translation" id="card-back-translation"></div>
            <div class="card-notes" id="card-back-notes" style="display:none"></div>
            <div class="card-example" id="card-example" style="display:none">
              <div class="card-example-label">Example</div>
              <div class="card-example-text" id="card-example-text"></div>
              <div class="card-example-reading" id="card-example-reading"></div>
              <div class="card-example-translation" id="card-example-translation"></div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div class="nav-row">
      <button class="btn btn-secondary btn-nav" id="btn-prev" onclick="prevCard()">← Prev</button>
      <button class="btn btn-secondary btn-nav" id="btn-next" onclick="nextCard()">Next →</button>
    </div>
  </div>

  <script>
    // ── Test cards ──
    // zh: common words, phrases, tones, retroflex sounds
    // ja: kanji+kana mix, pitch accent words, long compounds, sentence

    const cards = [
      // ── Mandarin ──
      {
        lang: 'zh', type: 'word',
        front: { text: '你好', reading: 'nǐ hǎo' },
        back: { translation: 'Hello', notes: 'Tones 3+3. Baseline — should be easy.' }
      },
      {
        lang: 'zh', type: 'word',
        front: { text: '谢谢', reading: 'xièxie' },
        back: { translation: 'Thank you', notes: 'Tone 4 + neutral. Tests tone sandhi and the "x" sound.' }
      },
      {
        lang: 'zh', type: 'word',
        front: { text: '吃饭', reading: 'chīfàn' },
        back: { translation: 'To eat', notes: 'Tones 1+4. Tests retroflex "ch" — a common TTS failure point.' }
      },
      {
        lang: 'zh', type: 'word',
        front: { text: '学习', reading: 'xuéxí' },
        back: { translation: 'To study', notes: 'Tones 2+2. Tests the "ü" sound written as "u" after "x".' }
      },
      {
        lang: 'zh', type: 'phrase',
        front: { text: '我听不懂', reading: 'wǒ tīng bù dǒng' },
        back: { translation: "I don't understand", notes: 'Tones 3+1+4+3. Tests tonal continuity across a phrase.' }
      },
      {
        lang: 'zh', type: 'word',
        front: { text: '二十四', reading: 'èrshísì' },
        back: { translation: 'Twenty-four', notes: 'Tones 4+2+4. Tests rapid tone switching and the "r" final.' }
      },

      // ── Japanese ──
      {
        lang: 'ja', type: 'word',
        front: { text: 'ありがとう', reading: 'arigatou' },
        back: { translation: 'Thank you', notes: 'All hiragana. Baseline — should be easy.' }
      },
      {
        lang: 'ja', type: 'word',
        front: { text: '食べる', reading: 'taberu' },
        back: { translation: 'To eat', notes: 'Common kanji + hiragana mix. Tests kanji reading.' }
      },
      {
        lang: 'ja', type: 'word',
        front: { text: '難しい', reading: 'muzukashii' },
        back: { translation: 'Difficult', notes: 'Tests kanji reading and the long "ii" ending.' }
      },
      {
        lang: 'ja', type: 'word',
        front: { text: '東京', reading: 'Tōkyō' },
        back: { translation: 'Tokyo', notes: 'Familiar proper noun. Tests long vowels (ō).' }
      },
      {
        lang: 'ja', type: 'word',
        front: { text: '図書館', reading: 'toshokan' },
        back: { translation: 'Library', notes: '3-kanji compound. Tests whether TTS reads it as one unit.' }
      },
      {
        lang: 'ja', type: 'phrase',
        front: { text: 'わかりません', reading: 'wakarimasen' },
        back: { translation: "I don't understand", notes: 'Polite negative. Tests natural sentence-level prosody.' }
      },
      {
        lang: 'ja', type: 'phrase',
        front: { text: '日本語を勉強しています', reading: 'nihongo wo benkyou shite imasu' },
        back: { translation: 'I am studying Japanese', notes: 'Mixed kanji/kana sentence. Tests complex TTS rendering.' }
      },
    ];

    let currentIndex = 0;
    let isFlipped = false;

    const ttsAvailable = 'speechSynthesis' in window;

    if (!ttsAvailable) {
      document.getElementById('tts-warning').classList.add('visible');
      document.getElementById('btn-play').style.display = 'none';
    }

    // ── Render ──

    function renderCard() {
      const card = cards[currentIndex];

      isFlipped = false;
      document.getElementById('card-inner').classList.remove('flipped');

      document.getElementById('review-counter').textContent =
        `${currentIndex + 1} / ${cards.length}`;

      document.getElementById('btn-prev').disabled = currentIndex === 0;
      document.getElementById('btn-next').disabled = currentIndex === cards.length - 1;

      document.getElementById('card-type').textContent = card.type || '';
      document.getElementById('card-front-text').textContent = card.front.text;

      const reading = document.getElementById('card-front-reading');
      reading.textContent = card.front.reading || '';
      reading.style.display = card.front.reading ? '' : 'none';

      document.getElementById('card-back-translation').textContent = card.back.translation;

      const notes = document.getElementById('card-back-notes');
      if (card.back.notes) {
        notes.textContent = card.back.notes;
        notes.style.display = '';
      } else {
        notes.style.display = 'none';
      }

      const exampleEl = document.getElementById('card-example');
      if (card.example?.text) {
        document.getElementById('card-example-text').textContent = card.example.text;
        const exReading = document.getElementById('card-example-reading');
        exReading.textContent = card.example.reading || '';
        exReading.style.display = card.example.reading ? '' : 'none';
        const exTranslation = document.getElementById('card-example-translation');
        exTranslation.textContent = card.example.translation || '';
        exTranslation.style.display = card.example.translation ? '' : 'none';
        exampleEl.style.display = '';
      } else {
        exampleEl.style.display = 'none';
      }

      // Reset play button
      const btn = document.getElementById('btn-play');
      btn.textContent = '▶ Play';
      btn.classList.remove('playing');
    }

    // ── Audio ──

    function playAudio() {
      if (!ttsAvailable) return;

      const card = cards[currentIndex];
      const btn = document.getElementById('btn-play');

      window.speechSynthesis.cancel();

      const utt = new SpeechSynthesisUtterance(card.front.text);
      utt.lang = card.lang === 'ja' ? 'ja-JP' : 'zh-CN';
      utt.rate = 0.9;

      btn.textContent = '◼ Playing…';
      btn.classList.add('playing');

      utt.onend = () => {
        btn.textContent = '▶ Play';
        btn.classList.remove('playing');
      };

      utt.onerror = () => {
        btn.textContent = '▶ Error';
        btn.classList.remove('playing');
      };

      window.speechSynthesis.speak(utt);
    }

    // ── Navigation ──

    function flipCard() {
      isFlipped = !isFlipped;
      document.getElementById('card-inner').classList.toggle('flipped', isFlipped);
    }

    function prevCard() {
      if (currentIndex > 0) { currentIndex--; renderCard(); }
    }

    function nextCard() {
      if (currentIndex < cards.length - 1) { currentIndex++; renderCard(); }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') prevCard();
      if (e.key === 'ArrowRight') nextCard();
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
      if (e.key === 'p') playAudio();
    });

    // Init
    renderCard();
  </script>
</body>
</html>
