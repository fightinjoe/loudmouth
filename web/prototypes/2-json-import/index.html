<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Import Cards</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f0;
      --surface: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #666;
      --text-tertiary: #999;
      --accent: #2d6a4f;
      --accent-light: #e8f5ee;
      --error: #c0392b;
      --error-light: #fdf2f2;
      --border: #e0e0e0;
      --radius: 16px;
      --radius-sm: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 1.25rem;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }

    .screen.active { display: flex; }

    /* ── Typography ── */

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    /* ── Buttons ── */

    .btn {
      display: block;
      width: 100%;
      padding: 0.875rem 1rem;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }

    .btn:active { opacity: 0.75; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn + .btn { margin-top: 0.75rem; }

    /* ── Import screen ── */

    #screen-import { gap: 0; }

    #screen-import h1 { margin-bottom: 0.25rem; }

    .textarea-wrap { flex: 1; display: flex; flex-direction: column; margin-bottom: 1rem; }

    textarea {
      flex: 1;
      width: 100%;
      min-height: 220px;
      padding: 0.875rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      color: var(--text);
      background: var(--surface);
      resize: none;
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.15s;
      margin-bottom: 0;
    }

    textarea:focus { border-color: var(--accent); }

    textarea.error { border-color: var(--error); }

    .error-msg {
      display: none;
      font-size: 0.8rem;
      color: var(--error);
      background: var(--error-light);
      border-radius: var(--radius-sm);
      padding: 0.625rem 0.75rem;
      margin-top: 0.5rem;
      line-height: 1.4;
    }

    .error-msg.visible { display: block; }

    /* ── Confirm screen ── */

    .confirm-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.75rem 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .confirm-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .confirm-count {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .confirm-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    /* ── Review screen ── */

    #screen-review {
      gap: 0;
    }

    .review-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .review-counter {
      font-size: 0.875rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .flip-hint {
      font-size: 0.75rem;
      color: var(--text-tertiary);
    }

    /* Card flip */

    .card-scene {
      flex: 1;
      perspective: 1200px;
      margin-bottom: 1.25rem;
      min-height: 280px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      min-height: 280px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .card-inner.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      background: var(--surface);
      border-radius: var(--radius);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .card-back-face {
      transform: rotateY(180deg);
      overflow-y: auto;
    }

    /* Front face */

    .card-front-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0.5rem;
    }

    .card-text {
      font-size: 2.5rem;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: 0.02em;
    }

    .card-reading {
      font-size: 1rem;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }

    .card-type-badge {
      align-self: flex-start;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
    }

    .card-tap-hint {
      align-self: center;
      font-size: 0.75rem;
      color: var(--text-tertiary);
      margin-top: auto;
    }

    /* Back face */

    .card-back-content {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: 100%;
    }

    .card-translation {
      font-size: 1.5rem;
      font-weight: 500;
      line-height: 1.3;
    }

    .card-notes {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.5;
      padding: 0.625rem 0.75rem;
      background: var(--bg);
      border-radius: var(--radius-sm);
    }

    .card-example {
      border-left: 3px solid var(--accent-light);
      padding-left: 0.875rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .card-example-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      margin-bottom: 0.25rem;
    }

    .card-example-text {
      font-size: 1rem;
      line-height: 1.4;
    }

    .card-example-reading {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .card-example-translation {
      font-size: 0.875rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    /* Navigation */

    .nav-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .btn-nav {
      padding: 0.75rem;
      font-size: 0.9rem;
    }

    .btn-nav:disabled {
      opacity: 0.35;
      cursor: default;
    }
  </style>
</head>
<body>

  <!-- Screen 1: Import -->
  <div id="screen-import" class="screen active">
    <h1>Import Cards</h1>
    <p class="subtitle">Paste a card batch JSON below</p>
    <div class="textarea-wrap">
      <textarea id="json-input" placeholder='{"cards": [...]}'
        spellcheck="false" autocorrect="off" autocapitalize="none"></textarea>
      <div id="error-msg" class="error-msg"></div>
    </div>
    <button class="btn btn-primary" onclick="parseInput()">Parse Cards</button>
  </div>

  <!-- Screen 2: Confirm -->
  <div id="screen-confirm" class="screen">
    <h1>Cards Imported</h1>
    <p class="subtitle">Ready to review</p>
    <div class="confirm-card">
      <div class="confirm-icon">✓</div>
      <div class="confirm-count" id="confirm-count">0</div>
      <div class="confirm-label">cards</div>
    </div>
    <button class="btn btn-primary" onclick="startReview()">Flip Through Cards</button>
    <button class="btn btn-secondary" onclick="goToImport()">Import New</button>
  </div>

  <!-- Screen 3: Review -->
  <div id="screen-review" class="screen">
    <div class="review-header">
      <span class="review-counter" id="review-counter">1 / 0</span>
      <span class="flip-hint">tap card to flip</span>
    </div>

    <div class="card-scene" onclick="flipCard()">
      <div class="card-inner" id="card-inner">

        <div class="card-face card-front-face">
          <span class="card-type-badge" id="card-type"></span>
          <div class="card-front-text">
            <div class="card-text" id="card-front-text"></div>
            <div class="card-reading" id="card-front-reading"></div>
          </div>
          <span class="card-tap-hint">tap to reveal</span>
        </div>

        <div class="card-face card-back-face">
          <div class="card-back-content">
            <div class="card-translation" id="card-back-translation"></div>
            <div class="card-notes" id="card-back-notes" style="display:none"></div>
            <div class="card-example" id="card-example" style="display:none">
              <div class="card-example-label">Example</div>
              <div class="card-example-text" id="card-example-text"></div>
              <div class="card-example-reading" id="card-example-reading"></div>
              <div class="card-example-translation" id="card-example-translation"></div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div class="nav-row">
      <button class="btn btn-secondary btn-nav" id="btn-prev" onclick="prevCard()">← Prev</button>
      <button class="btn btn-secondary btn-nav" id="btn-next" onclick="nextCard()">Next →</button>
    </div>
    <button class="btn btn-secondary" onclick="goToImport()">New Import</button>
  </div>

  <script>
    let cards = [];
    let currentIndex = 0;
    let isFlipped = false;

    // ── Navigation ──

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function goToImport() {
      document.getElementById('json-input').value = '';
      clearError();
      showScreen('screen-import');
    }

    // ── Import ──

    function parseInput() {
      const raw = document.getElementById('json-input').value.trim();

      if (!raw) {
        showError('Paste a JSON card batch first.');
        return;
      }

      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        showError('Invalid JSON. Check for missing brackets, commas, or quotes.\n' + e.message);
        return;
      }

      if (!parsed.cards || !Array.isArray(parsed.cards)) {
        showError('Expected an object with a "cards" array: {"cards": [...]}');
        return;
      }

      if (parsed.cards.length === 0) {
        showError('The cards array is empty.');
        return;
      }

      const invalid = [];
      parsed.cards.forEach((c, i) => {
        const missing = [];
        if (!c.lang) missing.push('lang');
        if (!c.front?.text) missing.push('front.text');
        if (!c.back?.translation) missing.push('back.translation');
        if (missing.length) invalid.push(`Card ${i + 1}: missing ${missing.join(', ')}`);
      });

      if (invalid.length) {
        showError('Some cards are missing required fields:\n' + invalid.slice(0, 3).join('\n') +
          (invalid.length > 3 ? `\n…and ${invalid.length - 3} more` : ''));
        return;
      }

      // Assign id + importedAt at ingest time; all cards in this batch share the same timestamp
      const importedAt = new Date().toISOString();
      cards = parsed.cards.map((c, i) => ({
        id: `${importedAt}-${String(i).padStart(4, '0')}`,
        importedAt,
        ...c,
      }));
      clearError();
      document.getElementById('confirm-count').textContent = cards.length;
      showScreen('screen-confirm');
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.add('visible');
      document.getElementById('json-input').classList.add('error');
    }

    function clearError() {
      const el = document.getElementById('error-msg');
      el.classList.remove('visible');
      document.getElementById('json-input').classList.remove('error');
    }

    // ── Review ──

    function startReview() {
      currentIndex = 0;
      isFlipped = false;
      renderCard();
      showScreen('screen-review');
    }

    function renderCard() {
      const card = cards[currentIndex];

      // Reset flip
      isFlipped = false;
      document.getElementById('card-inner').classList.remove('flipped');

      // Counter
      document.getElementById('review-counter').textContent =
        `${currentIndex + 1} / ${cards.length}`;

      // Nav buttons
      document.getElementById('btn-prev').disabled = currentIndex === 0;
      document.getElementById('btn-next').disabled = currentIndex === cards.length - 1;

      // Front
      document.getElementById('card-type').textContent = card.type || '';
      document.getElementById('card-front-text').textContent = card.front.text;
      const reading = document.getElementById('card-front-reading');
      reading.textContent = card.front.reading || '';
      reading.style.display = card.front.reading ? '' : 'none';

      // Back
      document.getElementById('card-back-translation').textContent = card.back.translation;

      const notes = document.getElementById('card-back-notes');
      if (card.back.notes) {
        notes.textContent = card.back.notes;
        notes.style.display = '';
      } else {
        notes.style.display = 'none';
      }

      const exampleEl = document.getElementById('card-example');
      if (card.example?.text) {
        document.getElementById('card-example-text').textContent = card.example.text;
        const exReading = document.getElementById('card-example-reading');
        exReading.textContent = card.example.reading || '';
        exReading.style.display = card.example.reading ? '' : 'none';
        const exTranslation = document.getElementById('card-example-translation');
        exTranslation.textContent = card.example.translation || '';
        exTranslation.style.display = card.example.translation ? '' : 'none';
        exampleEl.style.display = '';
      } else {
        exampleEl.style.display = 'none';
      }
    }

    function flipCard() {
      isFlipped = !isFlipped;
      document.getElementById('card-inner').classList.toggle('flipped', isFlipped);
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard();
      }
    }

    function nextCard() {
      if (currentIndex < cards.length - 1) {
        currentIndex++;
        renderCard();
      }
    }

    // Keyboard nav (desktop testing)
    document.addEventListener('keydown', e => {
      const screen = document.querySelector('.screen.active').id;
      if (screen !== 'screen-review') return;
      if (e.key === 'ArrowLeft') prevCard();
      if (e.key === 'ArrowRight') nextCard();
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
    });
  </script>
</body>
</html>
