name: web-app CI

on:
  push:
    branches: [main, claude/jovial-lalande]
    paths: ['web/app/**', '.github/workflows/web-app-ci.yml']
  pull_request:
    paths: ['web/app/**', '.github/workflows/web-app-ci.yml']

defaults:
  run:
    working-directory: web/app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - run: npm ci

      # Unit tests (Vitest).
      - run: npm test

      # End-to-end smoke tests (Playwright). The chromium browser is cached
      # by version so we only re-download when Playwright bumps.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/app/playwright-report
          retention-days: 7
