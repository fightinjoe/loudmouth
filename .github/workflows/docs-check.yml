# What each step does and why: docs/tooling/ci.md
name: docs check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # staleness warnings compare source commit dates with page `verified` dates

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: node scripts/check-docs.mjs
