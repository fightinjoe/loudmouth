title: "Vegan Izakaya Ordering"
answers:
  "Venue Type": "Izakaya / Casual Pub"
  "Dietary Specificity": "Strict Vegan (no dashi/fish broth, no egg, no dairy)"
  "Ordering Style": "Talking directly to the server"
checklist:
  - "State your dietary restrictions clearly upfront"
  - "Ask if a dish contains hidden animal broths or dairy"
  - "Request modifications or omissions"
  - "Express appreciation for accommodating your diet"
groups:
  - title: "State Your Diet"
    cards:
      - "I am strictly vegan."
      - "I cannot eat meat, fish, eggs, or dairy products."
      - "Certainly; understood."
      - "So, you cannot have any animal-derived ingredients, correct?"
  - title: "Check Ingredients"
    cards:
      - "Does this dish contain fish stock, chicken broth, or dairy products?"
      - "It contains fish stock and chicken broth."
      - "It does not contain dairy products."
      - "What does it contain?"
  - title: "Request Changes"
    cards:
      - "Leaving out the stock and chicken broth,"
      - "Could you make it without egg?"
      - "Can this be made vegan?"
      - "Can you accommodate a plant-based diet?"
  - title: "Handle a Limitation"
    cards:
      - "I am sorry, but we cannot remove the stock."
      - "If it is a vegetable-only dish, we can prepare it."
      - "In that case, I will have a vegetable-only dish, please."
      - "Thank you for accommodating me."
      - "Please wait a moment."
  - title: "Words for this exchange"
    cards:
      - "strict; rigorous"
      - "soup stock or cooking broth"
      - "chicken-bone broth"
      - "dairy products"
      - "animal-derived; of animal origin"
      - "to leave out; remove"
      - "without egg; egg-free"
      - "vegetables"
      - "accommodation; handling of a request"
  - title: "Example conversation"
    cards:
      - "I am strictly vegan. I cannot eat meat, fish, eggs, or dairy products."
      - "Certainly. So, you cannot have any animal-derived ingredients, correct?"
      - "Does this dish contain fish stock, chicken broth, or dairy products?"
      - "It contains fish stock and chicken broth, but it does not contain dairy products."
      - "Could you leave out the stock and chicken broth and make it without egg?"
      - "I am sorry, but we cannot remove the stock. If it is a vegetable-only dish, we can prepare it."
      - "In that case, I will have a vegetable-only dish, please. Thank you for accommodating me."
      - "Certainly. Please wait a moment."
notes: ""

