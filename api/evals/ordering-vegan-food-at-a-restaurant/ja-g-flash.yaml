title: "Vegan Dining at an Izakaya"
answers:
  "Venue Type": "Izakaya / Casual Pub"
  "Dietary Specificity": "Strict Vegan (no dashi/fish broth, no egg, no dairy)"
  "Ordering Style": "Talking directly to the server"
checklist:
  - "State your dietary restrictions clearly upfront"
  - "Ask if a dish contains hidden animal broths or dairy"
  - "Request modifications or omissions"
  - "Express appreciation for accommodating your diet"
groups:
  - title: "Words for this exchange"
    cards:
      - "broth / soup stock"
      - "bonito flakes"
      - "dairy products"
      - "egg"
      - "plant-based / vegetable-derived"
      - "without / left off"
      - "served on the side"
      - "soy sauce"
  - title: "Explaining dietary restrictions upfront"
    cards:
      - "I am strictly vegan, so I cannot eat any meat, fish, eggs, or dairy products at all."
      - "Are there any dishes that do not use animal ingredients?"
      - "Do you have a vegetarian menu?"
  - title: "Checking hidden animal broths & ingredients"
    cards:
      - "Yes, bonito flakes and fish broth are also not okay for me."
      - "Does the dressing on this tofu salad contain dashi broth?"
      - "Does the broth contain any meat or fish ingredients?"
      - "Is the frying oil shared with fish or meat?"
  - title: "Requesting modifications & omissions"
    cards:
      - "Grilled eggplant without bonito flakes, please."
      - "Instead of the dressing, could I have regular soy sauce?"
      - "Could you leave out the mayonnaise?"
      - "Could I have it with salt instead of sauce?"
  - title: "Staff responses & suggestions"
    cards:
      - "Certainly / Right away."
      - "Are items with fish in the broth or seasonings also not okay?"
      - "In that case, how about chilled tomato or grilled eggplant without bonito flakes?"
      - "Yes, the dressing contains fish broth."
      - "I'll bring the soy sauce on the side."
      - "I'll go check with the kitchen, so please wait a moment."
  - title: "Expressing appreciation"
    cards:
      - "Thank you for accommodating me. That's a huge help!"
      - "Thank you very much for taking my needs into account."
      - "It was delicious. Thank you for the meal."
  - title: "Example conversation"
    cards:
      - "I am strictly vegan, so I cannot eat any meat, fish, eggs, or dairy products at all."
      - "Understood. Are items with fish in the broth or seasonings also not okay?"
      - "Yes, bonito flakes and fish broth are also not okay for me."
      - "In that case, how about chilled tomato or grilled eggplant without bonito flakes?"
      - "Grilled eggplant without bonito flakes, please. Does the dressing on this tofu salad contain dashi broth?"
      - "Yes, the dressing contains fish broth."
      - "Instead of the dressing, could I have regular soy sauce?"
      - "I'll bring the soy sauce on the side."
      - "Thank you for accommodating me. That's a huge help!"
notes: ""

