  "Setting of care": "Public clinic / Urgent care (Seguro/Centro de Salud)"
  "Severity and duration": "Full-blown (body aches, congestion, fatigue)"
  "Administrative formality": "Direct & casual (talking straight to the doctor/pharmacist)"
checklist:
  - "Describe symptoms clearly (congestion, throat, fever)"
  - "Explain how long you've been sick"
  - "Understand the doctor's diagnosis or questions"
  - "Ask about medication and dosage instructions"
  - "Handle confusion when you don't catch what they said"
groups:
  - title: "Words for this exchange"
    cards:
      - "cold / head cold"
      - "congestion / stuffiness"
      - "sore throat"
      - "fever"
      - "chills"
      - "fatigue / tiredness"
      - "acetaminophen / paracetamol"
      - "medical prescription"
      - "rest / bed rest"
  - title: "Describing symptoms"
    cards:
      - "I have a lot of congestion and my throat hurts."
      - "My whole body aches."
      - "I have a headache and chills."
      - "I can't breathe well through my nose."
      - "I have a dry cough and an itchy throat."
  - title: "Duration and fever"
    cards:
      - "How long have you been feeling like this?"
      - "Have you had a fever?"
      - "I've been like this for three days and last night I had a fever."
      - "I started feeling sick yesterday afternoon."
      - "The symptoms started two days ago."
  - title: "Doctor questions and diagnosis"
    cards:
      - "Tell me, what symptoms do you have?"
      - "You have a bad cold, but your lungs are clear."
      - "It is just a common cold."
      - "You don't need antibiotics."
      - "Let's take a look at your throat."
      - "Breathe deeply, please."
  - title: "Handling confusion and clarifying"
    cards:
      - "Excuse me, could you speak slower?"
      - "I didn't catch that well."
      - "Could you repeat that, please?"
      - "Could you write it down on a piece of paper for me?"
  - title: "Medication and dosage instructions"
    cards:
      - "How do I need to take the medication?"
      - "Take one paracetamol every eight hours with meals."
      - "Does this require a prescription?"
      - "Drink plenty of fluids and get some rest."
      - "Understood, thank you very much for the help."
  - title: "Example conversation"
    cards:
      - "Tell me, what symptoms do you have?"
      - "I have a lot of congestion and my throat hurts."
      - "How long have you been feeling like this? Have you had a fever?"
      - "I've been like this for three days and last night I had a fever."
      - "You have a bad cold, but your lungs are clear."
      - "Excuse me, could you speak slower? I didn't catch that well."
      - "It is just a common cold. You don't need antibiotics."
      - "How do I need to take the medication?"
      - "Take one paracetamol every eight hours with meals."
      - "Understood, thank you very much for the help."
notes: ""

