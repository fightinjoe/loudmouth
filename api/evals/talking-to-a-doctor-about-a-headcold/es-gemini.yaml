title: "Urgent Care Headcold Visit"
answers:
  "Setting of care": "Public clinic / Urgent care (Seguro/Centro de Salud)"
  "Severity and duration": "Full-blown (body aches, congestion, fatigue)"
  "Administrative formality": "Direct & casual (talking straight to the doctor/pharmacist)"
checklist:
  - "Describe symptoms clearly (congestion, throat, fever)"
  - "Explain how long you've been sick"
  - "Understand the doctor's diagnosis or questions"
  - "Ask about medication and dosage instructions"
  - "Handle confusion when you don't catch what they said"
groups:
  - title: "Core Vocabulary"
    cards:
      - "sore throat"
      - "fever"
      - "cough"
      - "congestion"
      - "body aches"
      - "prescription"
      - "pill"
  - title: "Describing Symptoms & Duration"
    cards:
      - "I have a fever and a bad sore throat."
      - "I feel fatigue and aches all over my body."
      - "I have severe nasal congestion and a cough."
      - "I started feeling sick three days ago."
  - title: "Understanding the Doctor & Asking Questions"
    cards:
      - "Is it a common cold or an infection?"
      - "What medication should I take?"
      - "Every how many hours should I take this pill?"
      - "You have a strong viral case, but it is not serious."
      - "Take this syrup twice a day with meals."
  - title: "Handling Confusion"
    cards:
      - "I didn't understand you well, can you repeat please?"
      - "How do you spell that?"
  - title: "Example conversation"
    cards:
      - "I have a fever and a bad sore throat."
      - "Since when have you had these symptoms?"
      - "I started feeling sick three days ago."
      - "You have a strong viral case, but it is not serious."
      - "I didn't understand you well, can you repeat please?"
      - "It's just a cold. I am going to give you a prescription for the pain."
      - "Every how many hours should I take this pill?"
      - "Take one every eight hours with plenty of water."
notes: ""

