title: "Head Cold Clinic Visit"
answers:
  "Setting of care": "Public clinic / Urgent care (Seguro/Centro de Salud)"
  "Severity and duration": "Full-blown (body aches, congestion, fatigue)"
  "Administrative formality": "Direct & casual (talking straight to the doctor/pharmacist)"
checklist:
  - "Describe symptoms clearly (congestion, throat, fever)"
  - "Explain how long you've been sick"
  - "Understand the doctor's diagnosis or questions"
  - "Ask about medication and dosage instructions"
  - "Handle confusion when you don't catch what they said"
groups:
  - title: "Describing your symptoms"
    cards:
      - "Good morning, doctor."
      - "I've been feeling very sick for three days."
      - "I have a lot of congestion, a sore throat, and a fever."
      - "My muscles also ache."
      - "I'm exhausted."
      - "Yes, I have a temperature of 38.5 degrees."
      - "I don't have trouble breathing, but I have a dry cough."
  - title: "Questions and examination"
    cards:
      - "What symptoms do you have?"
      - "Have you taken your temperature?"
      - "Do you have a cough or trouble breathing?"
      - "How long have you felt this way?"
      - "Are you allergic to any medication?"
  - title: "Diagnosis and advice"
    cards:
      - "It looks like a bad cold, not a bacterial infection."
      - "Rest and drink plenty of fluids."
      - "It doesn't seem serious."
      - "If it gets worse or you have trouble breathing, return to the clinic."
      - "I understand."
  - title: "Medication instructions"
    cards:
      - "What medication do you recommend for me?"
      - "How often should I take it?"
      - "You can take paracetamol."
      - "One tablet every eight hours, after eating."
      - "Don't take more than three a day."
      - "So, how many days should I take it for?"
      - "For three days."
  - title: "When you miss something"
    cards:
      - "Can you repeat that more slowly?"
      - "I didn't understand the dosage."
      - "Do you mean one tablet every eight hours?"
      - "Could you write it down, please?"
  - title: "Words for this exchange"
    cards:
      - "congestion; blockage"
      - "sore throat"
      - "fever"
      - "cough"
      - "exhausted"
      - "common cold"
      - "tablet; pill"
      - "to get worse"
  - title: "Example conversation"
    cards:
      - "Good morning, doctor. I've been feeling very sick for three days."
      - "What symptoms do you have?"
      - "I have a lot of congestion, a sore throat, and a fever. My muscles also ache, and I'm exhausted."
      - "Have you taken your temperature? Do you have a cough or trouble breathing?"
      - "Yes, I have a temperature of 38.5 degrees. I don't have trouble breathing, but I have a dry cough."
      - "It looks like a bad cold, not a bacterial infection. Rest and drink plenty of fluids."
      - "What medication do you recommend, and how often should I take it?"
      - "You can take paracetamol: one tablet every eight hours, after eating. Don't take more than three a day."
      - "I understand. So, how many days should I take it for?"
      - "For three days. If it gets worse or you have trouble breathing, return to the clinic."
notes: ""

