swagger: "2.0"
info:
  title: Translation API
  description: Routes translation requests to multiple LLM backends
  version: "1.0"

host: "translation-api-gateway-2qqw247r.uc.gateway.dev"
schemes:
  - https

x-google-backend:
  address: https://YOUR_CLOUD_RUN_URL

paths:
  /translate:
    post:
      summary: Translate text using a specified LLM
      operationId: translate
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - text
              - targetLanguage
              - llm
            properties:
              text:
                type: string
                description: The text to translate
              targetLanguage:
                type: string
                description: The target language for translation
              llm:
                type: string
                description: The LLM to use for translation
                enum:
                  - google
                  - claude
                  - chatgpt
      responses:
        200:
          description: Successful translation
          schema:
            type: object
            properties:
              translations:
                type: array
                items:
                  type: object
                  properties:
                    translation:
                      type: string
                    lang:
                      type: string
                    text:
                      type: string
                    ruby_markup:
                      type: string
                      x-nullable: true
        400:
          description: Bad request (missing fields or unknown LLM)
        502:
          description: LLM or validation error
