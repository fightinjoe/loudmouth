swagger: "2.0"
info:
  title: Catchphrase API
  description: Routes language-learning requests to a Cloud Run service with a server-selected LLM backend
  version: "3.0"

schemes:
  - https

x-google-backend:
  address: https://YOUR_CLOUD_RUN_URL
  # The phrasebook pipeline can spend up to 245s across bounded generation,
  # translation, retry, and backoff stages. Keep this above its hard request
  # deadline so the service's own response surfaces instead of an opaque 504.
  # Max permitted is 600.0.
  deadline: 270.0

securityDefinitions:
  firebase:
    type: oauth2
    flow: implicit
    authorizationUrl: ""
    x-google-issuer: "https://securetoken.google.com/YOUR_FIREBASE_PROJECT_ID"
    x-google-jwks_uri: "https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com"
    x-google-audiences: "YOUR_FIREBASE_PROJECT_ID"

# Default closed; every preflight is an explicit exception.
security:
  - firebase: []

paths:
  /phrasebook-title:
    options:
      security: []
      summary: CORS preflight
      operationId: phrasebookTitleOptions
      responses:
        204:
          description: CORS preflight response
    post:
      security:
        - firebase: []
      summary: Distill a seed into a short English phrasebook title
      operationId: phrasebookTitle
      consumes: [application/json]
      produces: [application/json]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [seed]
            properties:
              seed:
                type: string
                maxLength: 200
      responses:
        200:
          description: English phrasebook title and model usage
          schema:
            type: object
            required: [title, usage]
            properties:
              title:
                type: string
                maxLength: 80
              usage:
                $ref: '#/definitions/Usage'
        400:
          description: Bad request (missing/invalid field or client-selected llm)
        502:
          description: LLM request failed or returned an invalid response

  /phrase-breakdown:
    options:
      security: []
      summary: CORS preflight
      operationId: phraseBreakdownOptions
      parameters: []
      responses:
        204:
          description: CORS preflight response
    post:
      security:
        - firebase: []
      summary: Explain a saved phrase occurrence as contextual chunks and dictionary Words
      operationId: phraseBreakdown
      consumes: [application/json]
      produces: [application/json]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/BreakdownRequest'
      responses:
        200:
          description: Versioned source-aligned Chunk and Word candidates with model usage
          schema:
            $ref: '#/definitions/BreakdownResponse'
        400:
          description: Bad request (missing/invalid field or client-selected llm)
        502:
          description: LLM request failed or returned an invalid response

  /context:
    options:
      security: []
      summary: CORS preflight
      operationId: contextOptions
      parameters: []
      responses:
        204:
          description: CORS preflight response
    post:
      security:
        - firebase: []
      summary: Generate clarifying questions, a conversation checklist, and a seed-based illustration prompt
      operationId: context
      consumes: [application/json]
      produces: [application/json]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [seed, language]
            properties:
              seed:
                type: string
                maxLength: 200
                description: Situation, activity, or topic. Max 200 characters.
              language:
                type: string
                enum: [zh, ja, es, cs, uk]
              ability:
                type: string
                enum: [none, basics, conversational]
      responses:
        200:
          description: Clarifying questions, checklist, watercolor image prompt, and model usage
          schema:
            $ref: '#/definitions/ContextResponse'
        400:
          description: Bad request (missing/invalid field or client-selected llm)
        502:
          description: LLM request failed or returned an invalid response

  /phrasebook:
    options:
      security: []
      summary: CORS preflight
      operationId: phrasebookOptions
      parameters: []
      responses:
        204:
          description: CORS preflight response
    post:
      security:
        - firebase: []
      summary: Generate a bespoke phrasebook from selected context
      operationId: phrasebook
      consumes: [application/json]
      produces: [application/json]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [seed, language, ability, answers, checklist]
            properties:
              seed:
                type: string
                maxLength: 200
                description: Situation, activity, or topic. Max 200 characters.
              language:
                type: string
                enum: [zh, ja, es, cs, uk]
              ability:
                type: string
                enum: [none, basics, conversational]
              answers:
                type: object
                maxProperties: 5
                additionalProperties:
                  type: string
                  maxLength: 500
              checklist:
                type: array
                minItems: 1
                maxItems: 8
                items:
                  type: string
                  maxLength: 120
      responses:
        200:
          description: Versioned independent topic essentials, vocabulary, dialogue, and mixed-model usage
          schema:
            $ref: '#/definitions/PhrasebookResponse'
        400:
          description: Bad request (missing/invalid field or client-selected llm)
        502:
          description: LLM request failed or returned an invalid response

  /phrasebook-image:
    options:
      security: []
      summary: CORS preflight
      operationId: phrasebookImageOptions
      responses:
        204:
          description: CORS preflight response
    post:
      security:
        - firebase: []
      summary: Generate a contextual watercolor PNG
      operationId: phrasebookImage
      consumes: [application/json]
      produces: [application/json]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [prompt, output_format]
            additionalProperties: false
            properties:
              prompt:
                type: string
                minLength: 1
                maxLength: 2000
              output_format:
                type: string
                enum: [png]
      responses:
        200:
          description: Validated PNG produced by FLUX.2 Klein 4B
          schema:
            $ref: '#/definitions/PhrasebookImageResponse'
        400:
          description: Invalid prompt, format, or extra request fields
        502:
          description: Missing credentials, provider failure, timeout, or unsafe image output

definitions:
  ContextResponse:
    type: object
    required: [questions, checklist, imagePrompt, usage]
    additionalProperties: false
    properties:
      questions:
        type: array
        minItems: 1
        maxItems: 5
        items:
          type: object
          required: [label, options]
          additionalProperties: false
          properties:
            label:
              type: string
              minLength: 1
            options:
              type: array
              minItems: 2
              maxItems: 5
              items:
                type: string
                minLength: 1
      checklist:
        type: array
        minItems: 1
        maxItems: 8
        items:
          type: object
          required: [label, checked]
          additionalProperties: false
          properties:
            label:
              type: string
              minLength: 1
            checked:
              type: boolean
      imagePrompt:
        type: string
        minLength: 1
        maxLength: 2000
      usage:
        $ref: '#/definitions/Usage'

  PhrasebookImage:
    type: object
    required: [dataUrl, mediaType, width, height]
    additionalProperties: false
    properties:
      dataUrl:
        type: string
        maxLength: 8388630
        pattern: '^data:image/png;base64,[A-Za-z0-9+/]+={0,2}$'
      mediaType:
        type: string
        enum: [image/png]
      width:
        type: integer
        minimum: 1
        maximum: 4000000
      height:
        type: integer
        minimum: 1
        maximum: 4000000
    description: Server verifies decoded PNG pixels, at most 4 megapixels and 6 MiB, visible content, and 16:9 ratio within 0.03. Transparency is not required.

  ImageStageUsage:
    type: object
    required: [provider, model, costUsd, durationMs]
    additionalProperties: false
    properties:
      provider:
        type: string
        minLength: 1
      model:
        type: string
        minLength: 1
      costUsd:
        type: number
        minimum: 0
        x-nullable: true
      durationMs:
        type: number
        minimum: 0

  PhrasebookImageResponse:
    type: object
    required: [image, usage]
    additionalProperties: false
    properties:
      image:
        $ref: '#/definitions/PhrasebookImage'
      usage:
        type: object
        required: [model, costUsd, durationMs, stages]
        additionalProperties: false
        properties:
          model:
            type: string
            enum: ['black-forest-labs/flux.2-klein-4b']
          costUsd:
            type: number
            minimum: 0
            x-nullable: true
          durationMs:
            type: number
            minimum: 0
          stages:
            type: array
            minItems: 1
            maxItems: 1
            items:
              $ref: '#/definitions/ImageStageUsage'

  Usage:
    type: object
    required: [model, inputTokens, outputTokens, totalTokens, costUsd, durationMs]
    additionalProperties: false
    properties:
      model:
        type: string
        minLength: 1
      inputTokens:
        type: integer
        minimum: 0
      outputTokens:
        type: integer
        minimum: 0
      totalTokens:
        type: integer
        minimum: 0
      costUsd:
        type: number
        minimum: 0
        x-nullable: true
      durationMs:
        type: integer
        minimum: 0

  ReadingToken:
    type: array
    minItems: 2
    maxItems: 2
    description: Exact [base, annotation|null] pair; runtime validation enforces element types and text alignment.
    items: {}

  Snapshot:
    type: object
    required: [lang, text, translation]
    additionalProperties: false
    properties:
      lang:
        type: string
        enum: [zh, ja, es, cs, uk]
      text:
        type: string
        minLength: 1
        maxLength: 2000
      reading:
        type: array
        minItems: 1
        items:
          $ref: '#/definitions/ReadingToken'
      romanization:
        type: string
        minLength: 1
        maxLength: 2000
      translation:
        type: string
        minLength: 1
        maxLength: 2000

  SourceRef:
    type: object
    minProperties: 1
    additionalProperties: false
    description: Navigation hint with at least cardId or occurrenceId; runtime validation enforces that invariant.
    properties:
      cardId:
        type: string
        minLength: 1
      occurrenceId:
        type: string
        minLength: 1

  PhraseSource:
    type: object
    required: [snapshot]
    additionalProperties: false
    properties:
      snapshot:
        $ref: '#/definitions/Snapshot'
      ref:
        $ref: '#/definitions/SourceRef'

  Span:
    type: object
    required: [start, end]
    additionalProperties: false
    properties:
      start:
        type: integer
        minimum: 0
        description: Inclusive JavaScript UTF-16 offset in snapshot.text.
      end:
        type: integer
        minimum: 1
        description: Exclusive JavaScript UTF-16 offset in snapshot.text.

  Evidence:
    type: object
    required: [snapshot, span]
    additionalProperties: false
    properties:
      snapshot:
        $ref: '#/definitions/Snapshot'
      ref:
        $ref: '#/definitions/SourceRef'
      span:
        $ref: '#/definitions/Span'

  Example:
    type: object
    required: [text]
    additionalProperties: false
    properties:
      text:
        type: string
        minLength: 1
        maxLength: 2000
      reading:
        type: array
        minItems: 1
        items:
          $ref: '#/definitions/ReadingToken'
      romanization:
        type: string
        minLength: 1
        maxLength: 2000
      translation:
        type: string
        minLength: 1
        maxLength: 2000

  Card:
    type: object
    required: [type, lang, text, translation]
    additionalProperties: false
    description: Type-discriminated Card. Runtime validation requires partOfSpeech and senseKey only for word; source, role, and explanation only for chunk; phrase has neither variant set. Swagger 2 documents the shared fields while runtime validation enforces the exact variant.
    properties:
      type:
        type: string
        enum: [word, phrase, chunk]
      lang:
        type: string
        enum: [zh, ja, es, cs, uk]
      text:
        type: string
        minLength: 1
        maxLength: 2000
      reading:
        type: array
        minItems: 1
        items:
          $ref: '#/definitions/ReadingToken'
      romanization:
        type: string
        minLength: 1
        maxLength: 2000
      translation:
        type: string
        minLength: 1
        maxLength: 2000
      definition:
        type: string
        minLength: 1
        maxLength: 2000
      formality:
        type: string
        enum: [casual, polite, formal, slang, vulgar]
      notes:
        type: string
        minLength: 1
        maxLength: 2000
      example:
        $ref: '#/definitions/Example'
      partOfSpeech:
        type: string
        enum: [noun, verb, adjective, adverb, pronoun, determiner, preposition, postposition, conjunction, particle, interjection, numeral, expression, other]
      senseKey:
        type: string
        minLength: 1
        maxLength: 120
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      source:
        $ref: '#/definitions/Evidence'
      role:
        type: string
        minLength: 1
        maxLength: 200
      explanation:
        type: string
        minLength: 1
        maxLength: 1000

  Candidate:
    type: object
    required: [card]
    additionalProperties: false
    properties:
      card:
        $ref: '#/definitions/Card'
      sources:
        type: array
        minItems: 1
        description: Word evidence only; Phrase and Chunk candidates omit this field.
        items:
          $ref: '#/definitions/Evidence'

  PhrasebookPhrase:
    type: object
    required: [id, card]
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      card:
        allOf:
          - $ref: '#/definitions/Card'
          - properties:
              type:
                type: string
                enum: [phrase]

  PhrasebookExampleLine:
    type: object
    required: [id, card, speaker]
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      card:
        allOf:
          - $ref: '#/definitions/Card'
          - properties:
              type:
                type: string
                enum: [phrase]
      speaker:
        type: string
        enum: [you, partner]

  PhrasebookExchangeTurn:
    type: object
    required: [speaker, responses]
    additionalProperties: false
    properties:
      speaker:
        type: string
        enum: [you, partner]
      responses:
        type: array
        minItems: 1
        description: Explicit alternative responses for this speaker turn. No maximum; more than 3 is kept and flagged count-overrun (section responses).
        items:
          $ref: '#/definitions/PhrasebookPhrase'

  PhrasebookExchange:
    type: object
    required: [id, title, lines]
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      title:
        type: string
        minLength: 1
        maxLength: 120
      lines:
        type: array
        minItems: 2
        description: Either speaker may start. Consecutive turns by one speaker are valid and flagged speaker-repeated. No maximum; more than 6 turns is kept and flagged count-overrun (section exchangeTurns). Continuation semantics are not validated.
        items:
          $ref: '#/definitions/PhrasebookExchangeTurn'

  PhrasebookWord:
    type: object
    required: [card]
    additionalProperties: false
    properties:
      card:
        allOf:
          - $ref: '#/definitions/Card'
          - required: [partOfSpeech, senseKey]
            properties:
              type:
                type: string
                enum: [word]
      sources:
        type: array
        minItems: 1
        items:
          $ref: '#/definitions/Evidence'

  PhrasebookWordFamily:
    type: object
    required: [id, title, items]
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      title:
        type: string
        minLength: 1
        maxLength: 120
      items:
        type: array
        minItems: 2
        items:
          $ref: '#/definitions/PhrasebookWord'

  PhrasebookGroup:
    type: object
    required: [id, title, thingsToSay, likelyExchanges, words, exampleConversation]
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      title:
        type: string
        minLength: 1
        maxLength: 120
      thingsToSay:
        type: array
        minItems: 0
        description: Empty only with a section-missing flag for this group. No maximum; more than 8 is kept and flagged count-overrun.
        items:
          $ref: '#/definitions/PhrasebookPhrase'
      likelyExchanges:
        type: array
        minItems: 0
        description: Empty only with a section-missing flag for this group. No maximum; more than 4 is kept and flagged count-overrun.
        items:
          $ref: '#/definitions/PhrasebookExchange'
      words:
        type: array
        minItems: 0
        description: Titled families with no maximum; more than 18 Words in total is kept and flagged count-overrun by the shared validator. Optional evidence references any phrase occurrence within this group.
        items:
          $ref: '#/definitions/PhrasebookWordFamily'
      exampleConversation:
        type: array
        minItems: 0
        description: Linear conversation; either speaker may start. Empty only with a section-missing flag, otherwise at least 2 lines. Consecutive lines by one speaker are valid and flagged speaker-repeated. No maximum; more than 12 is kept and flagged count-overrun.
        items:
          $ref: '#/definitions/PhrasebookExampleLine'

  PhrasebookFlag:
    type: object
    required: [code, groupIndex]
    additionalProperties: false
    description: >-
      A recovery in an accepted response; the shared validator checks each flag against the content.
      Fields by code: vocab-source-missing has wordIndex and reason unresolved; count-overrun has section, received
      and limit, plus exchangeIndex for exchangeTurns and exchangeIndex and lineIndex for responses;
      content-dropped has section and reason invalid-entry, too-few-turns or single-word-family;
      word-family-merged has section words and familyIndex; speaker-repeated has section likelyExchanges (with
      exchangeIndex) or exampleConversation, and lineIndex; section-missing has section and marks an empty section.
    properties:
      code:
        type: string
        enum: [vocab-source-missing, count-overrun, content-dropped, word-family-merged, speaker-repeated, section-missing]
      groupIndex:
        type: integer
        minimum: 0
        maximum: 7
      section:
        type: string
        enum: [thingsToSay, likelyExchanges, exchangeTurns, responses, words, exampleConversation]
      reason:
        type: string
        enum: [unresolved, invalid-entry, too-few-turns, single-word-family]
      wordIndex:
        type: integer
        minimum: 0
        description: Index into the group's flattened family/item Word order.
      received:
        type: integer
        minimum: 0
      limit:
        type: integer
        minimum: 0
      exchangeIndex:
        type: integer
        minimum: 0
      lineIndex:
        type: integer
        minimum: 0
      familyIndex:
        type: integer
        minimum: 0

  PhrasebookResponse:
    type: object
    required: [schemaVersion, title, groups, flags, usage]
    additionalProperties: false
    properties:
      schemaVersion:
        type: integer
        enum: [4]
      title:
        type: string
        minLength: 1
        maxLength: 200
      groups:
        type: array
        minItems: 1
        maxItems: 8
        items:
          $ref: '#/definitions/PhrasebookGroup'
      flags:
        type: array
        description: Content drops and family merges can repeat; other flags appear once.
        items:
          $ref: '#/definitions/PhrasebookFlag'
      usage:
        $ref: '#/definitions/Usage'

  BreakdownGenerationContext:
    type: object
    required: [seed, ability, answers]
    additionalProperties: false
    properties:
      seed:
        type: string
        minLength: 1
        maxLength: 200
      ability:
        type: string
        enum: [none, basics, conversational]
      answers:
        type: object
        maxProperties: 5
        additionalProperties:
          type: string
          minLength: 1
          maxLength: 500

  BreakdownContext:
    type: object
    additionalProperties: false
    properties:
      generation:
        $ref: '#/definitions/BreakdownGenerationContext'
      groupTitle:
        type: string
        minLength: 1
        maxLength: 500
      speaker:
        type: string
        enum: [you, partner]

  BreakdownRequest:
    type: object
    required: [schemaVersion, source]
    additionalProperties: false
    properties:
      schemaVersion:
        type: integer
        enum: [2]
      source:
        $ref: '#/definitions/PhraseSource'
      context:
        $ref: '#/definitions/BreakdownContext'

  BreakdownTarget:
    type: object
    required: [kind]
    additionalProperties: false
    description: Runtime validation requires index only for kind=word and a Chunk card only for kind=chunk.
    properties:
      kind:
        type: string
        enum: [word, chunk]
      index:
        type: integer
        minimum: 0
      card:
        $ref: '#/definitions/Card'

  BreakdownChunk:
    type: object
    required: [start, end, text, gloss, role, explanation, words, target]
    additionalProperties: false
    properties:
      start:
        type: integer
        minimum: 0
        description: Inclusive JavaScript UTF-16 offset in request source snapshot text.
      end:
        type: integer
        minimum: 1
        description: Exclusive JavaScript UTF-16 offset in request source snapshot text.
      text:
        type: string
        minLength: 1
        maxLength: 2000
      gloss:
        type: string
        minLength: 1
        maxLength: 500
      role:
        type: string
        minLength: 1
        maxLength: 200
      explanation:
        type: string
        minLength: 1
        maxLength: 1000
      words:
        type: array
        maxItems: 32
        description: Dictionary Word candidates with exact request-source evidence.
        items:
          $ref: '#/definitions/Candidate'
      target:
        $ref: '#/definitions/BreakdownTarget'

  BreakdownFlag:
    type: object
    required: [code, chunkIndex, wordIndex, reason]
    additionalProperties: false
    properties:
      code:
        type: string
        enum: [word-source-missing]
      chunkIndex:
        type: integer
        minimum: 0
        maximum: 31
      wordIndex:
        type: integer
        minimum: 0
        maximum: 31
        description: Index into the chunk's Word candidates.
      reason:
        type: string
        enum: [omitted, unresolved]

  BreakdownResponse:
    type: object
    required: [schemaVersion, chunks, flags, usage]
    additionalProperties: false
    properties:
      schemaVersion:
        type: integer
        enum: [2]
      chunks:
        type: array
        minItems: 1
        maxItems: 32
        items:
          $ref: '#/definitions/BreakdownChunk'
      flags:
        type: array
        uniqueItems: true
        description: One entry for every Word candidate without source evidence; empty when all Words have evidence.
        items:
          $ref: '#/definitions/BreakdownFlag'
      usage:
        $ref: '#/definitions/Usage'
