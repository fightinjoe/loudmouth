swagger: "2.0"
info:
  title: Catchphrase Lookup API
  description: Routes /lookup requests to a Cloud Run service backed by multiple LLM backends
  version: "1.0"

host: "translation-api-gateway-2qqw247r.uc.gateway.dev"
schemes:
  - https

x-google-backend:
  address: https://YOUR_CLOUD_RUN_URL

paths:
  /lookup:
    options:
      summary: CORS preflight
      operationId: lookupOptions
      parameters: []
      responses:
        204:
          description: CORS preflight response
    post:
      summary: Look up a term and return translation blocks with related groups
      operationId: lookup
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - term
              - language
            properties:
              term:
                type: string
                description: >
                  The word or phrase to translate. May carry a parenthetical for context,
                  e.g. "surf (v. to ride a wave)". Max 200 characters.
              language:
                type: string
                description: Target language
                enum:
                  - zh
                  - ja
                  - es
                  - cs
              ability:
                type: string
                description: Learner ability, limits output difficulty (default "beginner")
                enum:
                  - none
                  - beginner
                  - intermediate
                  - advanced
              formality:
                type: string
                description: Register to anchor the output (default "polite")
                enum:
                  - casual
                  - polite
                  - formal
              audience:
                type: string
                description: Who the learner is speaking to (default "staff")
                enum:
                  - stranger
                  - staff
                  - acquaintance
                  - family
              llm:
                type: string
                description: Which model backend generates the response (default "google")
                enum:
                  - google
                  - claude
                  - chatgpt
      responses:
        200:
          description: Successful lookup
          schema:
            type: object
            properties:
              blocks:
                type: array
                description: At most 4 blocks, one per distinct meaning of `term`
                items:
                  type: object
                  properties:
                    card:
                      $ref: '#/definitions/Card'
                    groups:
                      type: array
                      description: At most 8 groups total across all blocks
                      items:
                        type: object
                        properties:
                          title:
                            type: string
                            description: English heading, e.g. "Ordering at a restaurant"
                          cards:
                            type: array
                            description: At most 15 cards per group
                            items:
                              $ref: '#/definitions/Card'
        400:
          description: Bad request (missing/invalid field, unknown llm)
        502:
          description: LLM request failed or returned an invalid response

definitions:
  Card:
    type: object
    required:
      - lang
      - text
      - translation
    properties:
      lang:
        type: string
        enum: [zh, ja, es, cs]
      type:
        type: string
        enum: [word, phrase, sentence]
      text:
        type: string
        description: Word or phrase in the target language
      reading:
        type: array
        description: ReadingToken[] — [base, annotation|null] pairs (docs/CARD_SCHEMA.md)
        items:
          type: array
          items: {}
      romanization:
        type: string
      translation:
        type: string
        description: English translation
      definition:
        type: string
        description: The word's meaning; present only when disambiguation is needed
      formality:
        type: string
        enum: [casual, polite, formal, slang]
      context:
        type: string
        description: The parenthetical term context, or the parent group's title
      notes:
        type: string
      example:
        type: object
        properties:
          text:
            type: string
          reading:
            type: array
            items:
              type: array
              items: {}
          translation:
            type: string
