swagger: "2.0"
info:
  title: Translation API
  description: Routes translation and card generation requests to multiple LLM backends
  version: "1.0"

host: "translation-api-gateway-2qqw247r.uc.gateway.dev"
schemes:
  - https

x-google-backend:
  address: https://YOUR_CLOUD_RUN_URL

paths:
  /translate:
    post:
      summary: Translate text using a specified LLM
      operationId: translate
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - text
              - targetLanguage
              - llm
            properties:
              text:
                type: string
                description: The text to translate
              targetLanguage:
                type: string
                description: The target language for translation
              llm:
                type: string
                description: The LLM to use for translation
                enum:
                  - google
                  - claude
                  - chatgpt
      responses:
        200:
          description: Successful translation
          schema:
            type: object
            properties:
              translations:
                type: array
                items:
                  type: object
                  properties:
                    translation:
                      type: string
                    lang:
                      type: string
                    text:
                      type: string
                    ruby_markup:
                      type: string
                      x-nullable: true
        400:
          description: Bad request (missing fields or unknown LLM)
        502:
          description: LLM or validation error

  /generate-cards:
    post:
      summary: Generate language flashcards using a specified LLM
      operationId: generateCards
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - lang
              - topic
            properties:
              lang:
                type: string
                description: Target language code
                enum:
                  - zh
                  - ja
              topic:
                type: string
                description: Topic or instruction for card generation (e.g. "ordering food at a restaurant")
              count:
                type: integer
                description: Number of cards to generate (default 15, max 50)
                minimum: 1
                maximum: 50
              llm:
                type: string
                description: The LLM to use (default "google")
                enum:
                  - google
                  - claude
                  - chatgpt
      responses:
        200:
          description: Successfully generated card batch
          schema:
            type: object
            properties:
              cards:
                type: array
                items:
                  type: object
                  required:
                    - lang
                    - text
                    - reading
                    - translation
                  properties:
                    lang:
                      type: string
                      description: '"zh" or "ja"'
                    type:
                      type: string
                      description: '"word", "phrase", or "sentence"'
                    text:
                      type: string
                      description: Word or phrase in the target language
                    reading:
                      type: string
                      description: Pinyin (zh) or hiragana (ja) reading
                    translation:
                      type: string
                      description: English translation
                    notes:
                      type: string
                      description: Optional grammatical notes or usage context
                    example:
                      type: object
                      properties:
                        text:
                          type: string
                        reading:
                          type: string
                        translation:
                          type: string
        400:
          description: Bad request (invalid lang, missing topic, unknown LLM, count out of range)
        502:
          description: LLM or validation error
